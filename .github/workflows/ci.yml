# Full test suite on every push/PR, then deploy on main. This is the complete
# gate: the Docker image build (which Railway runs on deploy) can only run the
# pure Go tests — DB-backed tests skip there because the builder has no
# Postgres. Here they run for real against a postgres service container,
# including the -race concurrency regressions — and only a green run on main
# ships (the `deploy` job below runs `railway up`, the same thing as
# `make deploy`, so a red suite never reaches production).
name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edi
          POSTGRES_PASSWORD: edi
          POSTGRES_DB: edi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Explicitly set -> dbtest FAILS (never skips) if the DB is unreachable.
      EDI_TEST_DATABASE_URL: postgres://edi:edi@localhost:5432/edi_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Backend — vet + tests (with race detector)
        working-directory: server
        run: |
          go vet ./...
          gofmt -l . | tee /dev/stderr | wc -l | grep -q '^ *0$'
          go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Frontend — typecheck + build
        working-directory: client
        run: |
          npm ci
          npm run build

  # Push-to-deploy, gated on the job above. Needs the RAILWAY_TOKEN repo
  # secret (a Railway *project* token for the production environment:
  # Railway → project → Settings → Tokens). Without it the job fails loudly
  # instead of silently skipping, and `make deploy` stays the manual path.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require RAILWAY_TOKEN
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set — add a Railway project token (see .github/workflows/ci.yml)"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Railway (edi-server, production)
        run: |
          npm i -g @railway/cli
          # Stamp the commit for /api/health (a tarball upload has no git
          # metadata); --skip-deploys so the variable change itself does not
          # redeploy the OLD image before `up` ships the new one.
          railway variable set "EDI_COMMIT=${GITHUB_SHA}" --service edi-server --environment production --skip-deploys
          railway up --ci --service edi-server --environment production

      - name: Wait for the new build to be live
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 10 https://edi-server-production.up.railway.app/api/health | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
              echo "live: ${GITHUB_SHA}"; exit 0
            fi
            sleep 10
          done
          echo "::error::new commit never reported healthy on /api/health"; exit 1
